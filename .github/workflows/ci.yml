name: CI

on:
 pull_request:
 push:
  branches: [main]

# a new push to the same branch cancels the run it replaces
concurrency:
 cancel-in-progress: true
 group: ci-${{ github.ref }}

permissions:
 contents: read

jobs:
 check:
  runs-on: ubuntu-latest
  timeout-minutes: 15
  steps:
   # actions are pinned to a commit SHA; the comment names the release
   - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
   - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
     with:
      cache: npm
      node-version: 22
   - run: npm ci
   - run: npm run check:pinned-deps
   - run: npm run check:log-uuids
   - run: npm run lint
   - run: npm run typecheck
   - run: npm test
